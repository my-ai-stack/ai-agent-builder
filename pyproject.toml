[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-builder"
version = "0.1.0"
description = "Build AI agents with drag-and-drop. No-code platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["ai-agents", "agent-builder", "no-code", "langchain", "autonomous"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "streamlit>=1.29.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/my-ai-stack/ai-agent-builder"
Repository = "https://github.com/my-ai-stack/ai-agent-builder"
